services:
  backend:
    build:
      context: ./backend
    restart: unless-stopped
    env_file:
      - ${APP_ENV_FILE:-./.env}
    environment:
      NODE_ENV: production
      PORT: 5000
      MONGODB_URI: ${MONGODB_URI:?Set your MongoDB Atlas MONGODB_URI in .env}
    networks:
      - foodbela
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"const prefix=process.env.API_PREFIX || '/api/v1'; fetch('http://127.0.0.1:5000' + prefix + '/health/ready').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""
        ]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

  restaurant-owner-web:
    build:
      context: ./restaurant-owner-web
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api/v1}
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-80}:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - foodbela
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

networks:
  foodbela:
    driver: bridge
